<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: dark)">
  <meta http-equiv="cache-control" content="no-cache">
  <link rel="icon" type="image/png" href="./public/assets/web/android-chrome-192x192.png">
  <!-- BBT: iconița de iPhone, 180×180, ca la admin. Fără ea iOS își alege singur una din manifest. -->
  <link rel="apple-touch-icon" href="./public/assets/web/apple-touch-icon.png">
  <title>BBT Community</title>
  <!-- BBT: albul temei din prima clipă, înainte de CSS-ul aplicației (până pe 30 oct, negru). -->
  <style>html,body{background:#FFFFFF}</style>
  <!--
    BBT: schimbul codului de intrare pornește aici, în paralel cu descărcarea interfeței, nu după ea.
    Altfel omul fără sesiune salvată așteaptă întâi bundle-ul (~0,4 s), apoi schimbul (~0,45 s). Îl
    preia src/bbt/Sso.tsx; fără el (build fără inject.js, HTML vechi din service worker), Sso.tsx
    face singur cererea. Adresa o pune docker/inject.js, care procesează și .html.
  -->
  <script>
    (function () {
      var admin = "__VITE_BBT_ADMIN_URL__";
      var fragment = location.hash.slice(1);
      var cod = new URLSearchParams(fragment).get("cod");
      if (location.pathname !== "/sso" || !cod || !admin || admin.indexOf("__VITE_") === 0) return;
      history.replaceState(null, "", "/sso");
      var raspuns = fetch(admin.replace(/[/]+$/, "") + "/api/public/stoat/schimb", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ cod: cod }),
      });
      raspuns.catch(function () {});
      window.__bbtSso = { fragment: fragment, raspuns: raspuns };
    })();
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <div id="floating"></div>
  <script src="/src/index.tsx" type="module"></script>
</body>

</html>
