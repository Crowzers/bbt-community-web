# BBT Community — imaginea interfeței, la fiecare push pe ramura `bbt`.
#
# Workflow-urile lor (docker-build, release-please, renovate, canary...) sunt DEZACTIVATE în fork
# din setările Actions, nu șterse din fișiere: așa fișierele rămân identice cu ale lor și
# sincronizarea cu upstream nu dă conflicte pe ele.
#
# Doar linux/amd64: serverul BBT (Hetzner, i7) e x86. Matricea lor amd64+arm ar fi dublat timpul
# și — cum scria fiecare job aceleași etichete — ultima arhitectură terminată o suprascria pe cealaltă.
#
# Imaginea e publică (pachetul moștenește vizibilitatea repo-ului public), deci Coolify o trage
# fără credențiale. Eticheta folosită în `hub/compose.yml` din repo-ul BBT e SHA-ul scurt, nu
# `bbt`: o etichetă mobilă ar fi schimbat interfața la orice repornire, fără niciun commit în BBT.

name: BBT imagine

on:
  push:
    branches: [bbt]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crowzers/bbt-community-web
          tags: |
            type=raw,value=bbt
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
