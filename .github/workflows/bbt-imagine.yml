# BBT Community — imaginea interfeței, la fiecare push pe ramura `bbt`.
#
# Workflow-urile lor (docker-build, release-please, renovate, canary...) sunt DEZACTIVATE în fork
# din setările Actions, nu șterse din fișiere: așa fișierele rămân identice cu ale lor și
# sincronizarea cu upstream nu dă conflicte pe ele.
#
# Doar linux/amd64: serverul BBT (Hetzner, i7) e x86. Matricea lor amd64+arm ar fi dublat timpul
# și — cum scria fiecare job aceleași etichete — ultima arhitectură terminată o suprascria pe cealaltă.
#
# Imaginea e publică (pachetul moștenește vizibilitatea repo-ului public), deci Coolify o trage
# fără credențiale. Din 5 oct 2026 interfața e o aplicație Coolify separată (rolling update, zero
# cădere) care rulează eticheta `bbt` = ultimul build de pe ramura asta; deploy-ul îl declanșează
# pasul de la final. Ce versiune rulează se vede în Coolify (deployments) și în eticheta SHA scurt,
# pusă pe aceeași imagine — un rollback = deploy cu eticheta SHA a versiunii bune.

name: BBT imagine

on:
  push:
    branches: [bbt]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crowzers/bbt-community-web
          tags: |
            type=raw,value=bbt
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy-ul aplicației Coolify „BBT Community Web" (rolling update: zero cădere).
      # Secretele se pun din Settings → Secrets and variables → Actions al acestui repo:
      #   COOLIFY_URL (adresa panoului, fără / la final), COOLIFY_TOKEN (token API cu drept de deploy),
      #   COOLIFY_WEB_UUID (uuid-ul aplicației, din adresa ei în Coolify).
      # Fără ele pasul se sare — imaginea rămâne construită, deploy-ul se dă de mână.
      - name: Deploy în Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEB_UUID" ]; then
            echo "Secretele Coolify lipsesc — deploy sărit."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_WEB_UUID&force=false"
